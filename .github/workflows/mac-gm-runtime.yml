name: Mac GM 실행기 (llama-server, Metal)

# 패치한 llama-server를 Mac(Apple Silicon)에서 빌드한다.
# 1) smoke: 시험용 설정으로 빌드해 작은 모델로 확인. 패치·빌드 스크립트가 바뀌어 push되면 저절로 돈다
#    (workflow_dispatch는 기본 브랜치에 이 파일이 있어야 보이므로, main에 합치기 전에는 push로 확인한다)
#    app: 게임 .app을 빌드해 화면 없이 잠깐 띄워 본다. Secret이 있으면 동적 서사까지 넣는다. zip은 Actions 아티팩트로 남긴다 (Mac 실기 시험용)
# 2) publish(선택, 손으로 실행): 배포용 설정(Secret)으로 빌드 → 실행기 릴리스 태그에 올린다
#    buildrelease.yml의 Mac 빌드도 실행기가 없으면 같은 방식으로 빌드해 올린다
# 자세한 내용: stigma-gm/MAC_GM.md

env:
  LLAMA_COMMIT: ${{ github.event.inputs.llama_commit || 'ba0ba54d93b25faf1e149f4ccedd3e9d84798563' }}

on:
  push:
    paths:
      - 'stigma-gm/tools/llama_patch/**'
      - '.github/workflows/mac-gm-runtime.yml'
      - '개발/build_exe.py'
      - '개발/frozen_compat.py'
  workflow_dispatch:
    inputs:
      llama_commit:
        description: 'llama.cpp 커밋 (stigma.patch를 만든 기준)'
        required: true
        default: 'ba0ba54d93b25faf1e149f4ccedd3e9d84798563'
      publish:
        description: '진짜 키로 빌드해 실행기 릴리스에 올리기 (Secret STIGMA_SERVER_KEY_INC 필요)'
        required: true
        default: false
        type: boolean
      runtime_tag:
        description: '올릴 실행기 릴리스 태그 (Windows llama-server.exe가 있는 곳)'
        required: true
        default: 'runtime-v1'

jobs:
  smoke:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-14, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: llama.cpp 받기 + 패치
        run: |
          git init llama && cd llama
          git remote add origin https://github.com/ggml-org/llama.cpp
          git fetch --depth 1 origin "$LLAMA_COMMIT"
          git checkout FETCH_HEAD
          git apply ../stigma-gm/tools/llama_patch/stigma.patch

      - name: 시험용 키 + 빌드
        run: |
          pip install numpy cryptography pyyaml tqdm   # tqdm·yaml: llama.cpp gguf-py가 불러온다
          python stigma-gm/tools/llama_patch/smoke_test.py genkey --src llama --out testkey.json
          bash stigma-gm/tools/llama_patch/build_server.sh llama

      # GitHub Mac 러너는 가상 머신이라 Metal 가속을 기대하지 않는다: CPU로 확인
      - name: 로드·생성 확인
        run: python stigma-gm/tools/llama_patch/smoke_test.py run --src llama --server llama/build-stigma/bin/llama-server --key testkey.json

  app:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # Secret이 둘 다 있으면 배포용 실행기와 비공개 생성물을 넣어 실제 Mac 시험용 앱을 만든다 (릴리스는 만들지 않는다)
      - name: 동적 서사 준비 (Secret이 있을 때)
        env:
          STIGMA_SERVER_KEY_INC: ${{ secrets.STIGMA_SERVER_KEY_INC }}
          STIGMA_GM_KEY: ${{ secrets.STIGMA_GM_KEY }}
        run: |
          if [ -z "$STIGMA_SERVER_KEY_INC" ] || [ -z "$STIGMA_GM_KEY" ]; then
            echo "::warning::Secret이 없어 동적 서사 없이 빌드"
            exit 0
          fi
          git init "$RUNNER_TEMP/llama" && cd "$RUNNER_TEMP/llama"
          git remote add origin https://github.com/ggml-org/llama.cpp
          git fetch --depth 1 origin "$LLAMA_COMMIT"
          git checkout FETCH_HEAD
          git apply "$GITHUB_WORKSPACE/stigma-gm/tools/llama_patch/stigma.patch"
          printf '%s' "$STIGMA_SERVER_KEY_INC" > ggml/src/stigma-key.inc
          bash "$GITHUB_WORKSPACE/stigma-gm/tools/llama_patch/build_server.sh" .
          rm -f ggml/src/stigma-key.inc
          mkdir -p "$GITHUB_WORKSPACE/개발/runtime/llama"
          cp build-stigma/bin/llama-server "$GITHUB_WORKSPACE/개발/runtime/llama/llama-server"
          printf '%s' "$STIGMA_GM_KEY" > "$GITHUB_WORKSPACE/개발/gm_key.py"

      - name: 앱 빌드
        run: |
          pip install rich colorama nuitka ordered-set zstandard pygame-ce cryptography
          python 개발/build_exe.py --name PROTOCOL_STIGMA

      # 입력을 기다리며 20초 뒤에도 떠 있으면 통과. 그 전에 끝나면 시작하다 죽은 것
      - name: 화면 없이 20초 실행
        run: |
          APP=개발/dist/PROTOCOL_STIGMA.app
          EXE="$APP/Contents/MacOS/$(/usr/libexec/PlistBuddy -c 'Print :CFBundleExecutable' "$APP/Contents/Info.plist")"
          SDL_VIDEODRIVER=dummy SDL_AUDIODRIVER=dummy "$EXE" > run.log 2>&1 &
          pid=$!
          sleep 20
          ls -la "$HOME/Library/Application Support/PROTOCOL_STIGMA" || true
          if kill -0 "$pid" 2>/dev/null; then
            kill "$pid"
          else
            cat run.log
            echo "::error::앱이 20초 안에 끝남"
            exit 1
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: PROTOCOL_STIGMA_mac_arm64
          path: 개발/dist/PROTOCOL_STIGMA_mac_arm64.zip
          retention-days: 7

  publish:
    needs: smoke
    if: ${{ github.event.inputs.publish == 'true' }}
    runs-on: macos-14
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: llama.cpp 받기 + 패치
        run: |
          git init llama && cd llama
          git remote add origin https://github.com/ggml-org/llama.cpp
          git fetch --depth 1 origin "$LLAMA_COMMIT"
          git checkout FETCH_HEAD
          git apply ../stigma-gm/tools/llama_patch/stigma.patch

      - name: 배포용 설정 (Secret)
        env:
          STIGMA_SERVER_KEY_INC: ${{ secrets.STIGMA_SERVER_KEY_INC }}
        run: |
          if [ -z "$STIGMA_SERVER_KEY_INC" ]; then
            echo "::error::STIGMA_SERVER_KEY_INC Secret 없음 (비공개 문서 참고)"
            exit 1
          fi
          printf '%s' "$STIGMA_SERVER_KEY_INC" > llama/ggml/src/stigma-key.inc

      - name: 빌드
        run: bash stigma-gm/tools/llama_patch/build_server.sh llama

      - name: 실행기 릴리스에 올리기
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp llama/build-stigma/bin/llama-server llama-server-macos-arm64
          rm -f llama/ggml/src/stigma-key.inc
          gh release upload "${{ github.event.inputs.runtime_tag }}" llama-server-macos-arm64 --clobber -R "${{ github.repository }}"
