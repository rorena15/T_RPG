name: Build & Release (Windows · Mac)

on:
  workflow_dispatch:
    inputs:

      # ── 버전 / 릴리즈 ──────────────────────────────────────────────────────
      version:
        description: '릴리즈 버전 태그 (예: v1.0.1)'
        required: true
        default: 'v1.0.0'

      release_title:
        description: '릴리즈 제목 (비우면 기본값 사용)'
        required: false
        default: ''

      notes:
        description: '업데이트 내용 (릴리즈 노트 본문)'
        required: true
        default: '버그 수정'

      release_mode:
        description: |
          릴리즈 모드
            latest   → 새 태그로 최신 릴리즈 생성
            rerelease → 기존 태그를 덮어쓰기 (같은 버전 재배포)
            draft    → 초안으로 저장 (게시 안 함)
            prerelease → 사전 릴리즈(베타) 표시
        required: true
        default: 'latest'
        type: choice
        options:
          - latest
          - rerelease
          - draft
          - prerelease

      # ── 빌드 옵션 ─────────────────────────────────────────────────────────
      python_version:
        description: 'Python 버전'
        required: true
        default: '3.11'
        type: choice
        options:
          - '3.11'
          - '3.12'
          - '3.10'

      exe_name:
        description: 'EXE 파일명 (확장자 제외)'
        required: true
        default: 'PROTOCOL_STIGMA'

      inject_version:
        description: 'constants.py 에 버전 자동 주입'
        required: true
        default: 'true'
        type: boolean

      noconsole:
        description: '--noconsole (콘솔 창 숨김)'
        required: true
        default: 'true'
        type: boolean

      legacy_exe:
        description: '예전 업데이터용 단일 exe도 같이 올리기 (폴더 배포로 넘어오는 동안)'
        required: true
        default: 'true'
        type: boolean

      runtime_tag:
        description: '동적 서사 실행기(패치 빌드 llama-server.exe)를 받을 릴리스 태그'
        required: true
        default: 'runtime-v1'

jobs:
  build-windows:
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      # ── Python 설정 ─────────────────────────────────────────────────────────
      - name: Python 설정
        uses: actions/setup-python@v5
        with:
          python-version: ${{ github.event.inputs.python_version }}

      # Windows는 Nuitka로 빌드한다 (개발/build_exe.py 참고: PyInstaller exe는 소스가 거의 그대로 복원된다)
      - name: 의존성 설치
        run: pip install rich colorama nuitka ordered-set zstandard pygame-ce cryptography

      # ── 동적 서사 준비 ─────────────────────────────────────────────────────
      # 실행기는 공개 릴리스 자산에서, 비공개 생성물은 Secret에서 만든다 (공개 저장소에 넣지 않는다).
      # 둘 중 하나라도 없으면 build_exe.py가 동적 서사 없이 빌드한다.
      - name: 동적 서사 준비
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          STIGMA_GM_KEY: ${{ secrets.STIGMA_GM_KEY }}
        run: |
          New-Item -ItemType Directory -Force 개발/runtime/llama | Out-Null
          gh release download "${{ github.event.inputs.runtime_tag }}" -R "${{ github.repository }}" -p llama-server.exe -D 개발/runtime/llama
          if ($env:STIGMA_GM_KEY) {
            [IO.File]::WriteAllText("개발/gm_key.py", $env:STIGMA_GM_KEY)
          } else {
            Write-Host "::warning::STIGMA_GM_KEY Secret 없음 - 동적 서사 없이 빌드"
          }

      # ── 버전 주입 ───────────────────────────────────────────────────────────
      - name: 버전 주입
        if: ${{ github.event.inputs.inject_version == 'true' }}
        shell: pwsh
        run: |
          $version = "${{ github.event.inputs.version }}".TrimStart("v")
          (Get-Content 개발/constants.py -Encoding UTF8) `
            -replace 'GAME_VERSION\s*=\s*"[^"]*"', "GAME_VERSION = `"$version`"" `
            | Set-Content 개발/constants.py -Encoding UTF8
          Write-Host "버전 주입 완료: $version"

      # ── EXE 빌드 ────────────────────────────────────────────────────────────
      - name: EXE 빌드
        shell: pwsh
        run: |
          $args = @("--name", "${{ github.event.inputs.exe_name }}")
          if ("${{ github.event.inputs.noconsole }}" -ne "true") { $args += "--console" }
          # 폴더 배포 (zip). 업데이터는 이 zip을 받아 게임 폴더에 덮어쓴다
          python 개발/build_exe.py @args
          # 1.9.x 사용자용 단일 exe (예전 업데이터는 .exe만 찾는다). 폴더 배포로 다 넘어오면 끈다
          if ("${{ github.event.inputs.legacy_exe }}" -eq "true") { python 개발/build_exe.py @args --onefile }

      # ── 릴리즈 제목 결정 ────────────────────────────────────────────────────
      - name: 릴리즈 제목 결정
        id: title
        shell: pwsh
        run: |
          $custom = "${{ github.event.inputs.release_title }}".Trim()
          if ($custom -ne "") {
            $t = $custom
          } else {
            $t = "PROTOCOL: STIGMA ${{ github.event.inputs.version }} - 1막: 낙인"
          }
          echo "value=$t" >> $env:GITHUB_OUTPUT

      # ── GitHub Release 생성 ─────────────────────────────────────────────────
      - name: GitHub Release 생성 (latest)
        if: ${{ github.event.inputs.release_mode == 'latest' }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.version }}
          name: ${{ steps.title.outputs.value }}
          body: |
            ${{ github.event.inputs.notes }}

            Windows 64비트: `${{ github.event.inputs.exe_name }}_win64.zip`을 받아 압축을 풀고 폴더 안의 exe를 실행하세요. (Python 설치 불필요)
            이전 버전(단일 exe)을 쓰던 분은 게임 안 업데이트로 넘어올 수 있습니다.
            Mac (Apple Silicon, 동적 서사 베타): `${{ github.event.inputs.exe_name }}_mac_arm64.zip`을 받아 압축을 푸세요. 서명하지 않은 앱이라 처음 여는 방법은 README의 Mac 안내를 참고하세요.
          files: |
            개발/dist/${{ github.event.inputs.exe_name }}_win64.zip
            개발/dist/${{ github.event.inputs.exe_name }}.exe
          draft: false
          prerelease: false

      - name: GitHub Release 생성 (rerelease — 기존 태그 덮어쓰기)
        if: ${{ github.event.inputs.release_mode == 'rerelease' }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.version }}
          name: ${{ steps.title.outputs.value }}
          body: |
            ${{ github.event.inputs.notes }}

            Windows 64비트: `${{ github.event.inputs.exe_name }}_win64.zip`을 받아 압축을 풀고 폴더 안의 exe를 실행하세요. (Python 설치 불필요)
            이전 버전(단일 exe)을 쓰던 분은 게임 안 업데이트로 넘어올 수 있습니다.
            Mac (Apple Silicon, 동적 서사 베타): `${{ github.event.inputs.exe_name }}_mac_arm64.zip`을 받아 압축을 푸세요. 서명하지 않은 앱이라 처음 여는 방법은 README의 Mac 안내를 참고하세요.
          files: |
            개발/dist/${{ github.event.inputs.exe_name }}_win64.zip
            개발/dist/${{ github.event.inputs.exe_name }}.exe
          draft: false
          prerelease: false
          make_latest: true
          # 같은 태그가 이미 존재하면 파일만 교체
          fail_on_unmatched_files: false

      - name: GitHub Release 생성 (draft)
        if: ${{ github.event.inputs.release_mode == 'draft' }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.version }}
          name: ${{ steps.title.outputs.value }}
          body: |
            ${{ github.event.inputs.notes }}

            Windows 64비트: `${{ github.event.inputs.exe_name }}_win64.zip`을 받아 압축을 풀고 폴더 안의 exe를 실행하세요. (Python 설치 불필요)
            이전 버전(단일 exe)을 쓰던 분은 게임 안 업데이트로 넘어올 수 있습니다.
            Mac (Apple Silicon, 동적 서사 베타): `${{ github.event.inputs.exe_name }}_mac_arm64.zip`을 받아 압축을 푸세요. 서명하지 않은 앱이라 처음 여는 방법은 README의 Mac 안내를 참고하세요.
          files: |
            개발/dist/${{ github.event.inputs.exe_name }}_win64.zip
            개발/dist/${{ github.event.inputs.exe_name }}.exe
          draft: true
          prerelease: false

      - name: GitHub Release 생성 (prerelease)
        if: ${{ github.event.inputs.release_mode == 'prerelease' }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.version }}
          name: "[BETA] ${{ steps.title.outputs.value }}"
          body: |
            ⚠️ 사전 릴리즈(베타) 버전입니다.

            ${{ github.event.inputs.notes }}

            Windows 64비트: `${{ github.event.inputs.exe_name }}_win64.zip`을 받아 압축을 풀고 폴더 안의 exe를 실행하세요. (Python 설치 불필요)
            이전 버전(단일 exe)을 쓰던 분은 게임 안 업데이트로 넘어올 수 있습니다.
            Mac (Apple Silicon, 동적 서사 베타): `${{ github.event.inputs.exe_name }}_mac_arm64.zip`을 받아 압축을 푸세요. 서명하지 않은 앱이라 처음 여는 방법은 README의 Mac 안내를 참고하세요.
          files: |
            개발/dist/${{ github.event.inputs.exe_name }}_win64.zip
            개발/dist/${{ github.event.inputs.exe_name }}.exe
          draft: false
          prerelease: true

  # ── Mac 빌드 (Apple Silicon, 동적 서사 베타) ──────────────────────────────
  # Windows와 같이 Nuitka로 .app 폴더형을 만든다 (개발/build_exe.py). zip 하나로 올린다.
  # 실행기: runtime_tag의 llama-server-macos-arm64를 받는다. 없으면 Secret STIGMA_SERVER_KEY_INC로
  #   여기서 빌드해 runtime_tag에 올려 둔다 (다음 빌드부터는 받기만). 둘 다 없으면 동적 서사 없이 빌드.
  # 자세한 내용: stigma-gm/MAC_GM.md
  build-mac:
    needs: build-windows   # Windows가 릴리즈를 먼저 생성한 뒤 파일만 추가
    runs-on: macos-14
    permissions:
      contents: write
    env:
      LLAMA_COMMIT: ba0ba54d93b25faf1e149f4ccedd3e9d84798563   # stigma.patch 기준 (mac-gm-runtime.yml과 같게)

    steps:
      - uses: actions/checkout@v4

      - name: Python 설정
        uses: actions/setup-python@v5
        with:
          python-version: ${{ github.event.inputs.python_version }}

      - name: 의존성 설치
        run: pip install rich colorama nuitka ordered-set zstandard pygame-ce cryptography

      - name: 동적 서사 실행기 받기
        id: runtime
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p 개발/runtime/llama
          if gh release download "${{ github.event.inputs.runtime_tag }}" -R "${{ github.repository }}" \
               -p llama-server-macos-arm64 -D "$RUNNER_TEMP/rt"; then
            mv "$RUNNER_TEMP/rt/llama-server-macos-arm64" 개발/runtime/llama/llama-server
            chmod +x 개발/runtime/llama/llama-server
            echo "have=true" >> "$GITHUB_OUTPUT"
          else
            echo "have=false" >> "$GITHUB_OUTPUT"
          fi

      - name: 동적 서사 실행기 빌드 (릴리스에 없을 때)
        if: steps.runtime.outputs.have != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          STIGMA_SERVER_KEY_INC: ${{ secrets.STIGMA_SERVER_KEY_INC }}
        run: |
          if [ -z "$STIGMA_SERVER_KEY_INC" ]; then
            echo "::warning::Mac 실행기도 STIGMA_SERVER_KEY_INC Secret도 없음 - 동적 서사 없이 빌드"
            exit 0
          fi
          git init "$RUNNER_TEMP/llama" && cd "$RUNNER_TEMP/llama"
          git remote add origin https://github.com/ggml-org/llama.cpp
          git fetch --depth 1 origin "$LLAMA_COMMIT"
          git checkout FETCH_HEAD
          git apply "$GITHUB_WORKSPACE/stigma-gm/tools/llama_patch/stigma.patch"
          printf '%s' "$STIGMA_SERVER_KEY_INC" > ggml/src/stigma-key.inc
          bash "$GITHUB_WORKSPACE/stigma-gm/tools/llama_patch/build_server.sh" .
          rm -f ggml/src/stigma-key.inc
          cp build-stigma/bin/llama-server "$GITHUB_WORKSPACE/개발/runtime/llama/llama-server"
          cp build-stigma/bin/llama-server "$RUNNER_TEMP/llama-server-macos-arm64"
          gh release upload "${{ github.event.inputs.runtime_tag }}" "$RUNNER_TEMP/llama-server-macos-arm64" \
            --clobber -R "${{ github.repository }}"

      - name: 비공개 생성물 (Secret)
        env:
          STIGMA_GM_KEY: ${{ secrets.STIGMA_GM_KEY }}
        run: |
          if [ -n "$STIGMA_GM_KEY" ]; then
            printf '%s' "$STIGMA_GM_KEY" > 개발/gm_key.py
          else
            echo "::warning::STIGMA_GM_KEY Secret 없음 - 동적 서사 없이 빌드"
          fi

      - name: 버전 주입
        if: ${{ github.event.inputs.inject_version == 'true' }}
        run: |
          VERSION=$(echo "${{ github.event.inputs.version }}" | sed 's/^v//')
          sed -i '' "s/GAME_VERSION *= *\"[^\"]*\"/GAME_VERSION = \"$VERSION\"/" 개발/constants.py
          echo "버전 주입 완료: $VERSION"

      - name: Mac 앱 빌드
        run: python 개발/build_exe.py --name "${{ github.event.inputs.exe_name }}"

      - name: Mac 앱 릴리즈에 업로드
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.version }}
          files: 개발/dist/${{ github.event.inputs.exe_name }}_mac_arm64.zip
          fail_on_unmatched_files: false
